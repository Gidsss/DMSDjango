{% load customfilter %}
<div class="container-fluid">
    <form action=" " id="post-form">
        {% csrf_token %}
        <input type="hidden" name="id" value="{{ post.id }}">
        <input type="hidden" name="user" value="{% if not post %}{{ user.id }}{% else %}{{ post.user.id }}{% endif %}">

        <!-- Title Input -->
        <div class="form-group mb-3 ">
            <label for="title" class="control-label">Title</label>
            <input type="text" class="form-control rounded-0" id="title" name="title" value="{{ post.title }}" required>
        </div>

        <!-- Description Textarea -->
        <div class="form-group mb-3">
            <label for="description" class="control-label">Description</label>
            <textarea class="form-control rounded-0" name="description" id="description" rows="5"
                required>{{ post.description }}</textarea>
        </div>

        <!-- File Upload Input -->
        <div class="form-group mb-3 ">
            <label for="file_path" class="control-label">File</label>

            <!-- If it's a new post (no post.id), show file input -->
            {% if not post.id %}
            <input type="file" class="form-control rounded-0" id="file_path" name="file_path" value=""
                accept='application/pdf, text/csv, text/plain,.docs,.doc' required>
            <small class="text-muted"><i>Accept Only: application/pdf, text/csv, text/plain,
                    .docs,.doc</i></small>

            <!-- If it's an existing post (post.id exists), only show the current file -->
            {% else %}
            <div><small><span class="text-muted">Current File:</span> <a href="{{ post.file_path.url }}"
                        target="_blank">{{ post.file_path|replaceBlank:"uploads/" }}</a></small></div>
            {% endif %}
        </div>


        <!-- Decoded Binary Data -->
        {% if post.file_data %}
        <div class="form-group mb-3 ">
            <label for="decoded_binary" class="control-label">Decoded Binary Data</label>
            <textarea class="form-control rounded-0" id="decoded_binary" rows="10"
                readonly>{{ post.file_data|decode_binary }}</textarea>
        </div>
        {% endif %}
    </form>
</div>

<!-- JavaScript to handle form submission -->
<script>
    $(function () {
        $('#post-form').submit(function (e) {
            e.preventDefault();
            var _this = $(this);
            $('.err-msg').remove(); // Remove any previous error messages
            var el = $('<div>');
            el.addClass("alert alert-danger err-msg");
            el.hide();

            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }

            start_loader('encode');

            $.ajax({
                url: "{% url 'save-post' %}",
                data: new FormData($(this)[0]),
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err);
                    alert("An error occurred ", 'error');
                    end_loader();
                },
                success: function (resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        // Display the success message dynamically
                        var successMsg = $('<div class="alert alert-success text-center"></div>').text(resp.msg);
                        $('#uni_modal .modal-body').prepend(successMsg);
                        // Delay to allow users to see the success message
                        setTimeout(() => {
                            location.reload(); // Reload the page after a delay
                        }, 1500);
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.html(resp.msg);
                        _this.prepend(el); // Show the error message
                        el.show('slow');
                    } else {
                        el.text("An error occurred", 'error');
                        _this.prepend(el); // Show the error message
                        el.show('slow');
                        console.err(resp);
                    }
                    $("html, body, .modal").scrollTop(0);
                    end_loader();
                }
            });
        });
    });
</script>
